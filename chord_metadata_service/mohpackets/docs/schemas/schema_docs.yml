      - treatment_type_count
      title: TreatmentTypeCountSchema
      type: object
    TreatmentTypeEnum:
      enum:
      - Bone marrow transplant
      - Systemic therapy
      - No treatment
      - Targeted molecular therapy
      - Photodynamic therapy
      - Radiation therapy
      - Stem cell transplant
      - Surgery
      - Other
      - Unknown whether patient received treatment
      - Patient referred for treatment at other center, details unknown
      - Radiopharmaceutical Therapy
      title: TreatmentTypeEnum
      type: string
    TumourClassificationEnum:
      enum:
      - Not applicable
      - RX
      - R0
      - R1
      - R2
      - Not available
      title: TumourClassificationEnum
      type: string
    TumourDesginationEnum:
      enum:
      - Normal
      - Tumour
      title: TumourDesginationEnum
      type: string
    TumourFocalityEnum:
      enum:
      - Cannot be assessed
      - Multifocal
      - Not applicable
      - Unifocal
      - Not available
      title: TumourFocalityEnum
      type: string
    TumourGradeEnum:
      enum:
      - Low grade
      - High grade
      - GX
      - G1
      - G2
      - G3
      - G4
      - Low
      - High
      - Grade 1
      - Grade 2
      - Grade 3
      - Grade 4
      - Grade I
      - Grade II
      - Grade III
      - Grade IV
      - Grade Group 1
      - Grade Group 2
      - Grade Group 3
      - Grade Group 4
      - Grade Group 5
      - Not available
      title: TumourGradeEnum
      type: string
    TumourGradingSystemEnum:
      enum:
      - FNCLCC grading system
      - Four-tier grading system
      - Gleason grade group system
      - Grading system for GISTs
      - Grading system for GNETs
      - IASLC grading system
      - ISUP grading system
      - Nottingham grading system
      - Nuclear grading system for DCIS
      - Scarff-Bloom-Richardson grading system
      - Three-tier grading system
      - Two-tier grading system
      - WHO grading system for CNS tumours
      - Not available
      title: TumourGradingSystemEnum
      type: string
    TumourStagingSystemEnum:
      enum:
      - AJCC cancer staging system
      - Ann Arbor staging system
      - Binet staging system
      - Durie-Salmon staging system
      - FIGO staging system
      - International Neuroblastoma Risk Group Staging System
      - International Neuroblastoma Staging System
      - Lugano staging system
      - Rai staging system
      - Revised International staging system (R-ISS)
      - SEER staging system
      - St Jude staging system
      - Not available
      title: TumourStagingSystemEnum
      type: string
    uBooleanEnum:
      enum:
      - 'Yes'
      - 'No'
      - Not available
      title: uBooleanEnum
      type: string
  securitySchemes:
    DeleteAuth:
      scheme: bearer
      type: http
